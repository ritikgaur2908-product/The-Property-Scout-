version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: property_scout_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: property_scout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  vectordb:
    image: qdrant/qdrant:latest
    container_name: property_scout_vector
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
