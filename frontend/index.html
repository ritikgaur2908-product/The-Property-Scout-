<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ──────────────────────────────────────────────────── -->
    <title>The Property Scout — AI-Powered Rental Search in Bengaluru</title>
    <meta
      name="description"
      content="Find your perfect rental in Bengaluru by talking to an AI voice assistant. Get real-time listings, neighbourhood insights, and book site visits — all in a single conversation."
    />
    <meta name="keywords" content="Bengaluru rentals, Bangalore PG, AI property search, rental flats Bangalore, property scout" />
    <meta name="author" content="The Property Scout" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://thepropertyscout.in/" />

    <!-- ── Open Graph (Facebook / LinkedIn / WhatsApp) ─────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thepropertyscout.in/" />
    <meta property="og:title" content="The Property Scout — AI Rental Search for Bengaluru" />
    <meta
      property="og:description"
      content="Talk to an AI voice assistant to find the perfect rental flat or room in Bengaluru. Real listings, live neighbourhood insights, one-tap booking."
    />
    <meta property="og:image" content="https://thepropertyscout.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="The Property Scout" />
    <meta property="og:locale" content="en_IN" />

    <!-- ── Twitter / X Card ────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PropertyScoutIN" />
    <meta name="twitter:title" content="The Property Scout — AI Rental Search for Bengaluru" />
    <meta
      name="twitter:description"
      content="Conversational AI that finds your perfect Bengaluru rental. Speak your preferences, get matched listings, book a visit."
    />
    <meta name="twitter:image" content="https://thepropertyscout.in/og-image.png" />

    <!-- ── Structured Data (JSON-LD) ───────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "The Property Scout",
      "url": "https://thepropertyscout.in",
      "description": "AI-powered voice assistant for finding rental properties in Bengaluru",
      "applicationCategory": "RealEstateApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "areaServed": {
        "@type": "City",
        "name": "Bengaluru",
        "sameAs": "https://www.wikidata.org/wiki/Q1070"
      }
    }
    </script>

    <!-- ── Theme colour for mobile browsers ────────────────────────────── -->
    <meta name="theme-color" content="#080d1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
